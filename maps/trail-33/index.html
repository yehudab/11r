  <style>
    html,body { height: 100%; }
    main { min-height: 100%; }
    #map { height: calc(100% - 7rem); }

  <script>
    let taril = {"type":"Feature","properties":{"name":"ערד לכפר הנוקדים"},"geometry":{"type":"LineString","coordinates":[[35.20449,31.26331],[35.20368,31.26402],[35.20281,31.26818],[35.20008,31.27181],[35.1991,31.27428],[35.19686,31.27651],[35.19694,31.27839],[35.19863,31.28104],[35.20259,31.27923],[35.20616,31.28306],[35.20682,31.28215],[35.20909,31.28168],[35.21037,31.28085],[35.21334,31.27825],[35.21904,31.27878],[35.22098,31.27727],[35.22229,31.27714],[35.22456,31.27814],[35.22475,31.27894],[35.22751,31.28109],[35.23153,31.28024],[35.23239,31.2824],[35.23445,31.2837],[35.23531,31.28585],[35.2376,31.2876],[35.23879,31.28764],[35.24088,31.28628],[35.24168,31.28709],[35.24574,31.28685],[35.24584,31.28741],[35.24663,31.28758],[35.24872,31.28677],[35.24946,31.28702],[35.25019,31.2888],[35.25083,31.28907],[35.25019,31.2904],[35.25065,31.2923],[35.25188,31.29303],[35.25081,31.29491],[35.24998,31.29517],[35.25082,31.29647],[35.25401,31.29754],[35.25636,31.29745],[35.26017,31.29841],[35.26464,31.29999],[35.26654,31.30128],[35.2681,31.30381]]}};
    let baseStyle = {
        "color": "#ff7800",
        "weight": 5,
        "opacity": 0.65
    };
    let secondStyle = {
        "color": "#000000",
        "weight": 1,
        "opacity": 0.65
    };
    let map = L.map('map').setView([33.22966,35.61782], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    let feature = L.geoJSON(taril, { style: baseStyle}).addTo(map);
    L.geoJSON(taril, { style: secondStyle}).addTo(map);
    let bounds = feature.getBounds();

    let photos = [];
    function thumbIcon(photo, count) {
        let html = document.createElement('div');
        let img = document.createElement('img');
        img.src = photo.thumb;
        img.alt = '';
        html.append(img);
        if (count) {
            let badge = document.createElement('span');
            badge.textContent = count;
            html.append(badge);
        }
        return L.divIcon({ className: 'photo-thumb' + thumbClass(photo), html, iconSize: [56, 56] });
    }
    function photoPopup(photo, marker) {
        let popup = document.createElement('div');
        popup.className = 'photo-popup';
        let img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.caption;
        img.addEventListener('load', () => marker.getPopup().update());
        let caption = document.createElement('p');
        caption.textContent = photo.caption;
        caption.dir = 'auto';
        popup.append(img, caption);
        addEditorButtons(popup, photo, marker);
        if (photo.postUrl) {
            let link = document.createElement('a');
            link.href = photo.postUrl;
            link.textContent = photo.postTitle;
            popup.append(link);
        }
        return popup;
    }

    function thumbClass() { return ''; }
    function groupPhoto(markers) { return markers[0].options.photo; }
    function addEditorButtons() {}

    function showPhotos() {
        let cluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyDistanceMultiplier: 2.5,
            showCoverageOnHover: false,
            iconCreateFunction: (group) => thumbIcon(groupPhoto(group.getAllChildMarkers()), group.getChildCount())
        });
        photos.forEach(photo => {
            let marker = L.marker([photo.lat, photo.lon], {
                icon: thumbIcon(photo),
                photo,
                title: photo.caption,
                alt: photo.caption
            });
            marker.bindPopup(photoPopup(photo, marker), { minWidth: 280, maxWidth: 280 });
            cluster.addLayer(marker);
            bounds.extend(marker.getLatLng());
        });
        map.addLayer(cluster);
        map.fitBounds(bounds, { padding: [30, 30] });
    }
    if (photos.length) {

        showPhotos();

    }
    map.fitBounds(bounds, { padding: [30, 30] });
  </script>
