  <h1 class="text-center">מפת קטע מס׳ 34 - כפר הנוקדים למצדה מערב</h1>
  <p class="text-center text-sm italic mb-6">לא מתאימה לצרכי לניווט</p>
  <div id="map"></div>
  <style>
    html,body { height: 100%; }
    main { min-height: 100%; }
    #map { height: calc(100% - 7rem); }
    /* Leaflet sets width: auto on marker images, with this specificity */
    .leaflet-container .leaflet-marker-pane .photo-thumb img {
      width: 56px;

    }

    .photo-popup img { width: 100%; margin: 0 0 0.5rem; }

  </style>
  
  <script>
    let taril = {"type":"Feature","properties":{"name":"כפר הנוקדים למצדה מערב"},"geometry":{"type":"LineString","coordinates":[[35.26921,31.30673],[35.2697,31.31039],[35.2724,31.3118],[35.27308,31.31304],[35.27478,31.32021],[35.2769,31.32573],[35.27718,31.32846],[35.27912,31.33149],[35.27908,31.33221],[35.28008,31.33399],[35.27922,31.33585],[35.28013,31.33442],[35.27919,31.3327],[35.27906,31.33155],[35.28075,31.3322],[35.28431,31.3313],[35.28811,31.33365],[35.28955,31.33339],[35.29054,31.33508],[35.29154,31.3337],[35.29382,31.33439],[35.29634,31.33713],[35.29793,31.33753],[35.30012,31.33896],[35.30658,31.34075],[35.30743,31.34183],[35.30989,31.34268],[35.31083,31.34382],[35.31087,31.34358],[35.31364,31.34469],[35.31571,31.34493],[35.31633,31.34561],[35.32062,31.34695],[35.3243,31.34925],[35.32726,31.3495],[35.32864,31.34884],[35.33038,31.34842],[35.33063,31.34867],[35.3303,31.34835],[35.33069,31.34793],[35.33149,31.34784],[35.33199,31.34731],[35.33397,31.34733],[35.33403,31.34518],[35.33541,31.34223],[35.33531,31.33837],[35.33658,31.33621],[35.33754,31.33172],[35.33821,31.33061],[35.33808,31.32963],[35.33675,31.32724],[35.33659,31.32636],[35.33709,31.32578]]}};
    let baseStyle = {
        "color": "#ff7800",
        "weight": 5,
        "opacity": 0.65
    };
    let secondStyle = {
        "color": "#000000",
        "weight": 1,
        "opacity": 0.65
    };
    let map = L.map('map').setView([33.22966,35.61782], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    let feature = L.geoJSON(taril, { style: baseStyle}).addTo(map);
    L.geoJSON(taril, { style: secondStyle}).addTo(map);
    let bounds = feature.getBounds();

    let photos = [];
    function thumbIcon(photo, count) {
        let html = document.createElement('div');
        let img = document.createElement('img');
        img.src = photo.thumb;
        img.alt = '';
        html.append(img);
        if (count) {
            let badge = document.createElement('span');
            badge.textContent = count;
            html.append(badge);
        }
        return L.divIcon({ className: 'photo-thumb' + thumbClass(photo), html, iconSize: [56, 56] });
    }
    function photoPopup(photo, marker) {
        let popup = document.createElement('div');
        popup.className = 'photo-popup';
        let img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.caption;
        img.addEventListener('load', () => marker.getPopup().update());
        let caption = document.createElement('p');
        caption.textContent = photo.caption;
        caption.dir = 'auto';
        popup.append(img, caption);
        addEditorButtons(popup, photo, marker);
        if (photo.postUrl) {
            let link = document.createElement('a');
            link.href = photo.postUrl;
            link.textContent = photo.postTitle;
            popup.append(link);
        }
        return popup;
    }

    function thumbClass() { return ''; }
    function groupPhoto(markers) { return markers[0].options.photo; }
    function addEditorButtons() {}

    function showPhotos() {
        let cluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyDistanceMultiplier: 2.5,
            showCoverageOnHover: false,
            iconCreateFunction: (group) => thumbIcon(groupPhoto(group.getAllChildMarkers()), group.getChildCount())
        });
        photos.forEach(photo => {
            let marker = L.marker([photo.lat, photo.lon], {
                icon: thumbIcon(photo),
                photo,
                title: photo.caption,
                alt: photo.caption
            });
            marker.bindPopup(photoPopup(photo, marker), { minWidth: 280, maxWidth: 280 });
            cluster.addLayer(marker);
            bounds.extend(marker.getLatLng());
        });
        map.addLayer(cluster);
        map.fitBounds(bounds, { padding: [30, 30] });
    }
    if (photos.length) {

        showPhotos();

    }
    map.fitBounds(bounds, { padding: [30, 30] });
  </script>
