  <script>
    let taril = {"type":"Feature","properties":{"name":"חדרה למכמורת"},"geometry":{"type":"LineString","coordinates":[[34.88965,32.4633],[34.88839,32.46453],[34.88848,32.46467],[34.885,32.46451],[34.88388,32.46409],[34.8823,32.45997],[34.8817,32.45888],[34.87993,32.4519],[34.87928,32.45052],[34.87913,32.44797],[34.878,32.4461],[34.87865,32.44448],[34.87781,32.44349],[34.87729,32.44247],[34.87784,32.44123],[34.87874,32.4401],[34.87854,32.43948],[34.8775,32.43864],[34.87672,32.43597],[34.87555,32.43359],[34.87436,32.42606],[34.87367,32.426],[34.8738,32.42594],[34.87394,32.42404],[34.87313,32.42022],[34.87321,32.41902],[34.87125,32.41465],[34.86816,32.40884],[34.8687,32.4067],[34.86937,32.40556],[34.87016,32.40006]]}};
    let baseStyle = {
        "color": "#ff7800",
        "weight": 5,
        "opacity": 0.65
    };
    let secondStyle = {
        "color": "#000000",
        "weight": 1,
        "opacity": 0.65
    };
    let map = L.map('map').setView([33.22966,35.61782], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    let feature = L.geoJSON(taril, { style: baseStyle}).addTo(map);
    L.geoJSON(taril, { style: secondStyle}).addTo(map);
    let bounds = feature.getBounds();

    let photos = [{"id":"img/2025/05/shvil-29-6.jpg","src":"/img/2025/05/shvil-29-6.jpg","thumb":"/img/thumbs/2025/05/shvil-29-6.webp","caption":"טבלאות גדוד","lat":32.456914,"lon":34.881194,"postTitle":"שביל ישראל 29 - הליכה מקיסריה","postUrl":"/blog/2025/05/israel-trail-29/"},{"id":"img/2025/05/shvil-29-7.jpg","src":"/img/2025/05/shvil-29-7.jpg","thumb":"/img/thumbs/2025/05/shvil-29-7.webp","caption":"מפרצים בחוף","lat":32.446125,"lon":34.877906,"postTitle":"שביל ישראל 29 - הליכה מקיסריה","postUrl":"/blog/2025/05/israel-trail-29/"},{"id":"img/2025/05/shvil-29-8.jpg","src":"/img/2025/05/shvil-29-8.jpg","thumb":"/img/thumbs/2025/05/shvil-29-8.webp","caption":"טובלים במפרץ הסיני","lat":32.431156,"lon":34.875286,"postTitle":"שביל ישראל 29 - הליכה מקיסריה","postUrl":"/blog/2025/05/israel-trail-29/"},{"id":"img/2025/05/shvil-29-9.jpg","src":"/img/2025/05/shvil-29-9.jpg","thumb":"/img/thumbs/2025/05/shvil-29-9.webp","caption":"שמורת גדור","lat":32.426064,"lon":34.873731,"postTitle":"שביל ישראל 29 - הליכה מקיסריה","postUrl":"/blog/2025/05/israel-trail-29/"},{"id":"img/2025/05/shvil-29-10.jpg","src":"/img/2025/05/shvil-29-10.jpg","thumb":"/img/thumbs/2025/05/shvil-29-10.webp","caption":"סוסים בחוף מכמורת","lat":32.414856,"lon":34.871831,"postTitle":"שביל ישראל 29 - הליכה מקיסריה","postUrl":"/blog/2025/05/israel-trail-29/"}];
    function thumbIcon(photo, count) {
        let html = document.createElement('div');
        let img = document.createElement('img');
        img.src = photo.thumb;
        img.alt = '';
        html.append(img);
        if (count) {
            let badge = document.createElement('span');
            badge.textContent = count;
            html.append(badge);
        }
        return L.divIcon({ className: 'photo-thumb' + thumbClass(photo), html, iconSize: [56, 56] });
    }
    function photoPopup(photo, marker) {
        let popup = document.createElement('div');
        popup.className = 'photo-popup';
        let img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.caption;
        img.addEventListener('load', () => marker.getPopup().update());
        let caption = document.createElement('p');
        caption.textContent = photo.caption;
        caption.dir = 'auto';
        popup.append(img, caption);
        addEditorButtons(popup, photo, marker);
        if (photo.postUrl) {
            let link = document.createElement('a');
            link.href = photo.postUrl;
            link.textContent = photo.postTitle;
            popup.append(link);
        }
        return popup;
    }

    function thumbClass() { return ''; }
    function groupPhoto(markers) { return markers[0].options.photo; }
    function addEditorButtons() {}

    function showPhotos() {
        let cluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyDistanceMultiplier: 2.5,
            showCoverageOnHover: false,
            iconCreateFunction: (group) => thumbIcon(groupPhoto(group.getAllChildMarkers()), group.getChildCount())
        });
        photos.forEach(photo => {
            let marker = L.marker([photo.lat, photo.lon], {
                icon: thumbIcon(photo),
                photo,
                title: photo.caption,
                alt: photo.caption
            });
            marker.bindPopup(photoPopup(photo, marker), { minWidth: 280, maxWidth: 280 });
            cluster.addLayer(marker);
            bounds.extend(marker.getLatLng());
        });
        map.addLayer(cluster);
        map.fitBounds(bounds, { padding: [30, 30] });
    }
    if (photos.length) {

        showPhotos();

    }
    map.fitBounds(bounds, { padding: [30, 30] });
  </script>
