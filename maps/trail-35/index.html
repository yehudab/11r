  <h1 class="text-center">מפת קטע מס׳ 35 - צובה לעין לבן</h1>

  <div id="map"></div>
  <style>
    html,body { height: 100%; }
    main { min-height: 100%; }
    #map { height: calc(100% - 7rem); }
    /* Leaflet sets width: auto on marker images, with this specificity */

  <script>
    let taril = {"type":"Feature","properties":{"name":"צובה לעין לבן"},"geometry":{"type":"LineString","coordinates":[[35.11638,31.78445],[35.12557,31.78398],[35.12631,31.78425],[35.12634,31.78527],[35.12635,31.78437],[35.12782,31.78535],[35.13075,31.78537],[35.13104,31.78453],[35.13039,31.78332],[35.13166,31.78241],[35.1309,31.78026],[35.12872,31.77761],[35.12957,31.77654],[35.12959,31.77471],[35.12754,31.77284],[35.12745,31.7709],[35.1292,31.76956],[35.13065,31.76973],[35.13062,31.77182],[35.13454,31.7723],[35.13542,31.77061],[35.13802,31.7701],[35.1393,31.76894],[35.14279,31.76889],[35.14475,31.7714],[35.14649,31.77169],[35.14837,31.77347],[35.15025,31.77407],[35.15326,31.77305],[35.15408,31.76996],[35.15606,31.77176],[35.15868,31.77263],[35.16349,31.77024],[35.16233,31.7688],[35.16287,31.76652],[35.16586,31.76569],[35.16618,31.76437],[35.16826,31.76443],[35.16652,31.76349],[35.16458,31.76369],[35.1646,31.76084],[35.1618,31.75912],[35.16067,31.75737],[35.16113,31.75653],[35.16241,31.75633],[35.16144,31.75561],[35.16271,31.75413],[35.16322,31.75225],[35.16123,31.75045],[35.15957,31.7508],[35.15938,31.74845]]}};
    let baseStyle = {
        "color": "#ff7800",
        "weight": 5,
        "opacity": 0.65
    };
    let secondStyle = {
        "color": "#000000",
        "weight": 1,
        "opacity": 0.65
    };
    let map = L.map('map').setView([33.22966,35.61782], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    let feature = L.geoJSON(taril, { style: baseStyle}).addTo(map);
    L.geoJSON(taril, { style: secondStyle}).addTo(map);
    let bounds = feature.getBounds();

    let photos = [];
    function thumbIcon(photo, count) {
        let html = document.createElement('div');
        let img = document.createElement('img');
        img.src = photo.thumb;
        img.alt = '';
        html.append(img);
        if (count) {
            let badge = document.createElement('span');
            badge.textContent = count;
            html.append(badge);
        }
        return L.divIcon({ className: 'photo-thumb' + thumbClass(photo), html, iconSize: [56, 56] });
    }
    function photoPopup(photo, marker) {
        let popup = document.createElement('div');
        popup.className = 'photo-popup';
        let img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.caption;
        img.addEventListener('load', () => marker.getPopup().update());
        let caption = document.createElement('p');
        caption.textContent = photo.caption;
        caption.dir = 'auto';
        popup.append(img, caption);
        addEditorButtons(popup, photo, marker);
        if (photo.postUrl) {
            let link = document.createElement('a');
            link.href = photo.postUrl;
            link.textContent = photo.postTitle;
            popup.append(link);
        }
        return popup;
    }

    function thumbClass() { return ''; }
    function groupPhoto(markers) { return markers[0].options.photo; }
    function addEditorButtons() {}

    function showPhotos() {
        let cluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyDistanceMultiplier: 2.5,
            showCoverageOnHover: false,
            iconCreateFunction: (group) => thumbIcon(groupPhoto(group.getAllChildMarkers()), group.getChildCount())
        });
        photos.forEach(photo => {
            let marker = L.marker([photo.lat, photo.lon], {
                icon: thumbIcon(photo),
                photo,
                title: photo.caption,
                alt: photo.caption
            });
            marker.bindPopup(photoPopup(photo, marker), { minWidth: 280, maxWidth: 280 });
            cluster.addLayer(marker);
            bounds.extend(marker.getLatLng());
        });
        map.addLayer(cluster);
        map.fitBounds(bounds, { padding: [30, 30] });
    }
    if (photos.length) {

        showPhotos();

    }
    map.fitBounds(bounds, { padding: [30, 30] });
  </script>
