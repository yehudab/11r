  <script>
    let taril = {"type":"Feature","properties":{"name":"שער אשמדאי לראש מעלה עקרבים"},"geometry":{"type":"LineString","coordinates":[[35.22699,30.95213],[35.22712,30.95219],[35.22566,30.95263],[35.2242,30.9518],[35.22365,30.95207],[35.22232,30.95206],[35.22033,30.95149],[35.21893,30.95125],[35.21589,30.9519],[35.21496,30.9528],[35.20947,30.95263],[35.20818,30.95294],[35.20252,30.95246],[35.20155,30.95146],[35.18975,30.9511],[35.18587,30.95129],[35.18398,30.95092],[35.18257,30.95049],[35.17778,30.95128],[35.17334,30.95092],[35.17217,30.95069],[35.17113,30.95131],[35.16983,30.95147],[35.16745,30.95091],[35.16424,30.95055],[35.1626,30.9496],[35.16222,30.94964],[35.1614,30.94867],[35.16153,30.94826],[35.16146,30.94804],[35.16043,30.9473],[35.16035,30.94746],[35.16038,30.947],[35.16022,30.9462],[35.15994,30.94624],[35.15962,30.94609],[35.15969,30.94572],[35.15965,30.94553],[35.15887,30.94578],[35.1582,30.94484],[35.15904,30.94412],[35.15946,30.94331],[35.159,30.94251],[35.15809,30.9415],[35.15812,30.94019],[35.15871,30.93918],[35.15788,30.93805],[35.15527,30.93693],[35.15204,30.93527],[35.15176,30.93438]]}};
    let baseStyle = {
        "color": "#ff7800",
        "weight": 5,
        "opacity": 0.65
    };
    let secondStyle = {
        "color": "#000000",
        "weight": 1,
        "opacity": 0.65
    };
    let map = L.map('map').setView([33.22966,35.61782], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    let feature = L.geoJSON(taril, { style: baseStyle}).addTo(map);
    L.geoJSON(taril, { style: secondStyle}).addTo(map);
    let bounds = feature.getBounds();

    let photos = [{"id":"img/2025/01/shvil-24-9.jpg","src":"/img/2025/01/shvil-24-9.jpg","thumb":"/img/thumbs/2025/01/shvil-24-9.webp","caption":"שני נשרים","lat":30.947381,"lon":35.160347,"postTitle":"שביל ישראל 23+24 - בזכות הנשרים","postUrl":"/blog/2025/01/israel-trail-23-24/"},{"id":"img/2025/01/shvil-24-1.jpg","src":"/img/2025/01/shvil-24-1.jpg","thumb":"/img/thumbs/2025/01/shvil-24-1.webp","caption":"זריחה","lat":30.952147,"lon":35.226831,"postTitle":"שביל ישראל 23+24 - בזכות הנשרים","postUrl":"/blog/2025/01/israel-trail-23-24/"},{"id":"img/2025/01/shvil-24-2.jpg","src":"/img/2025/01/shvil-24-2.jpg","thumb":"/img/thumbs/2025/01/shvil-24-2.webp","caption":"יעל מעל שער אשמדאי","lat":30.951467,"lon":35.220433,"postTitle":"שביל ישראל 23+24 - בזכות הנשרים","postUrl":"/blog/2025/01/israel-trail-23-24/"},{"id":"img/2025/01/shvil-24-4.jpg","src":"/img/2025/01/shvil-24-4.jpg","thumb":"/img/thumbs/2025/01/shvil-24-4.webp","caption":"סלעים צבעוניים","lat":30.952511,"lon":35.205944,"postTitle":"שביל ישראל 23+24 - בזכות הנשרים","postUrl":"/blog/2025/01/israel-trail-23-24/"},{"id":"img/2025/01/shvil-24-7.jpg","src":"/img/2025/01/shvil-24-7.jpg","thumb":"/img/thumbs/2025/01/shvil-24-7.webp","caption":"מעלה עלי","lat":30.950531,"lon":35.164803,"postTitle":"שביל ישראל 23+24 - בזכות הנשרים","postUrl":"/blog/2025/01/israel-trail-23-24/"}];
    function thumbIcon(photo, count) {
        let html = document.createElement('div');
        let img = document.createElement('img');
        img.src = photo.thumb;
        img.alt = '';
        html.append(img);
        if (count) {
            let badge = document.createElement('span');
            badge.textContent = count;
            html.append(badge);
        }
        return L.divIcon({ className: 'photo-thumb' + thumbClass(photo), html, iconSize: [56, 56] });
    }
    function photoPopup(photo, marker) {
        let popup = document.createElement('div');
        popup.className = 'photo-popup';
        let img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.caption;
        img.addEventListener('load', () => marker.getPopup().update());
        let caption = document.createElement('p');
        caption.textContent = photo.caption;
        caption.dir = 'auto';
        popup.append(img, caption);
        addEditorButtons(popup, photo, marker);
        if (photo.postUrl) {
            let link = document.createElement('a');
            link.href = photo.postUrl;
            link.textContent = photo.postTitle;
            popup.append(link);
        }
        return popup;
    }

    function thumbClass() { return ''; }
    function groupPhoto(markers) { return markers[0].options.photo; }
    function addEditorButtons() {}

    function showPhotos() {
        let cluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyDistanceMultiplier: 2.5,
            showCoverageOnHover: false,
            iconCreateFunction: (group) => thumbIcon(groupPhoto(group.getAllChildMarkers()), group.getChildCount())
        });
        photos.forEach(photo => {
            let marker = L.marker([photo.lat, photo.lon], {
                icon: thumbIcon(photo),
                photo,
                title: photo.caption,
                alt: photo.caption
            });
            marker.bindPopup(photoPopup(photo, marker), { minWidth: 280, maxWidth: 280 });
            cluster.addLayer(marker);
            bounds.extend(marker.getLatLng());
        });
        map.addLayer(cluster);
        map.fitBounds(bounds, { padding: [30, 30] });
    }
    if (photos.length) {

        showPhotos();

    }
    map.fitBounds(bounds, { padding: [30, 30] });
  </script>
